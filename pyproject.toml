[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "rowvoi"
description = "Interactive disambiguation of rows in a dataset using value-of-information policies"
readme = "README.md"
authors = [
    { name = "Gaurav Sood", email = "contact@gsood.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
]
keywords = [
    "data-disambiguation",
    "value-of-information",
    "feature-selection",
    "interactive-ml",
    "data-cleaning",
    "entity-resolution",
    "mutual-information",
    "rag",
    "retrieval-augmented-generation",
    "context-selection",
    "set-cover",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/gojiplus/rowvoi"
Repository = "https://github.com/gojiplus/rowvoi"
Issues = "https://github.com/gojiplus/rowvoi/issues"
Documentation = "https://gojiplus.github.io/rowvoi/"

[project.optional-dependencies]
optimization = [
    "pulp>=2.7.0",
]
claude = [
    "anthropic>=0.116.0",
]
examples = [
    "scikit-learn>=1.7.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["*.ipynb"]  # notebooks are demo output, not linted source

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = [
    "D203", "D213", "D100", "D104", "D105", "D107",
    # __all__ is grouped by capability with section comments, which is more
    # useful to a reader than alphabetical order.
    "RUF022",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]
# Examples are runnable scripts: print IS the output, and narrating them in
# docstrings would bury the point.
"examples/**" = ["T201", "D"]
# Stochastic search (simulated annealing, genetic algorithms) and random
# benchmark sampling. `random` is the correct tool here; these are not
# security decisions.
"rowvoi/setcover.py" = ["S311"]
"rowvoi/eval.py" = ["S311"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Deliberately no --cov here: the wheel smoke test installs the built wheel
# into a clean venv with pytest but no pytest-cov, and unknown arguments abort
# the run. Ask for coverage explicitly instead (see `make test-cov`).
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.coverage.run]
source = ["rowvoi"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.deptry]
extend_exclude = [
    "tests/",
    "docs/",
    "examples/",
]
pep621_dev_dependency_groups = ["examples"]

[tool.pyright]
include = ["rowvoi"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["rowvoi"]

# Without an explicit sdist target hatchling sweeps in docs/, examples/,
# htmlcov/ and dist/.
[tool.hatch.build.targets.sdist]
include = [
    "/rowvoi",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[dependency-groups]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pytest>=8",
    # Not in the canon dev group, but pytest addopts hardcode --cov, so a
    # group-only sync fails without it.
    "pytest-cov>=4.0.0",
    "deptry>=0.20.0",
    "twine>=4.0.0",
]
