[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "rowvoi"
description = "Interactive disambiguation of rows in a dataset using value-of-information policies"
readme = "README.md"
authors = [
    { name = "Gaurav Sood", email = "contact@gsood.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
]
keywords = [
    "data-disambiguation",
    "value-of-information",
    "feature-selection",
    "interactive-ml",
    "data-cleaning",
    "entity-resolution",
    "mutual-information",
    "rag",
    "retrieval-augmented-generation",
    "context-selection",
    "set-cover",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
version = "0.2.0"

[project.urls]
Homepage = "https://github.com/gojiplus/rowvoi"
Repository = "https://github.com/gojiplus/rowvoi"
Issues = "https://github.com/gojiplus/rowvoi/issues"
Documentation = "https://gojiplus.github.io/rowvoi/"

[project.optional-dependencies]
optimization = [
    "pulp>=2.7.0",
]
claude = [
    "anthropic>=0.116.0",
]
examples = [
    "scikit-learn>=1.7.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["*.ipynb"]  # notebooks are demo output, not linted source

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs. RUF022: __all__ is grouped by capability with
# section comments, which is more useful to a reader than alphabetical order.
ignore = ["D203", "D213", "W191", "D206", "D300", "D100", "D104", "D105", "D107", "RUF022"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]
# Examples are runnable scripts: print IS the output, and narrating them in
# docstrings would bury the point.
"examples/**" = ["T201", "D"]
# Stochastic search (simulated annealing, genetic algorithms) and random
# benchmark sampling. `random` is the correct tool here; these are not
# security decisions.
"rowvoi/setcover.py" = ["S311"]
"rowvoi/eval.py" = ["S311"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Deliberately no --cov here: the wheel smoke test installs the built wheel
# into a clean venv with pytest but no pytest-cov, and unknown arguments abort
# the run. Ask for coverage explicitly instead (see `make test-cov`).
addopts = ["-ra", "--strict-markers", "--strict-config"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["rowvoi"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.deptry]
extend_exclude = [
    "tests/",
    "docs/",
    "examples/",
]
pep621_dev_dependency_groups = ["examples"]

[tool.pyright]
include = ["rowvoi"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.uv.build-backend]
module-name = "rowvoi"
module-root = ""
[dependency-groups]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "deptry>=0.20.0",
    "twine>=4.0.0",
    { include-group = "test" },
]
# The canon wheel job installs the built wheel with `--group test` in a clean
# venv, so this group must exist and carry everything the tests import.
test = ["pytest>=8", "pytest-cov>=6"]
