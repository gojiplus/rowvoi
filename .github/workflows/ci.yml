name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: rowvoi
      coverage-floor: 0
      # The canon default is ["3.11", "3.14"]. Pinned to match the classifiers
      # in pyproject.toml; re-running `preen adopt`/`update` overwrites this
      # file and silently restores the default.
      python-versions: '["3.11", "3.12", "3.13"]'
